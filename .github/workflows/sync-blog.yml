name: Sync blog posts

# Pulls the latest posts from the pckt.blog RSS feed into
# assets/data/blog.js and commits the change if anything is new.
# The site stays fully static — the feed is only fetched here, in CI.

on:
  schedule:
    - cron: "30 5 * * *"   # daily, 05:30 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update blog.js from feed
        run: python3 scripts/sync_blog.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/blog.js; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/blog.js
            git commit -m "Sync blog posts from feed"
            git push
          fi
